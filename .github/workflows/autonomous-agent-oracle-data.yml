name: Autonomous Agent Oracle Data

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger repository
        uses: actions/checkout@v4

      - name: Clone public 16-task source
        run: |
          git clone https://github.com/wkumagai/kaggle-autonomous-agent-baseline.git source
          cd source
          git checkout 1a71fdcc4755e82fadc77404a51077af85f78867

      - name: Build research artifact
        run: |
          mkdir -p artifact
          cp -a source/data artifact/data
          if [ -d source/experiments/bench_03 ]; then cp -a source/experiments/bench_03 artifact/bench_03; fi
          find artifact/data -maxdepth 2 -type f | sort > artifact/file_manifest.txt
          du -sh artifact > artifact/size.txt

      - name: Upload 16-task data
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-agent-16task-data
          path: artifact
          retention-days: 1
          compression-level: 6
